name: Bacon plot sanity check

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  render:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::knitr

      - name: Install RBacon
        run: R CMD INSTALL .

      - name: Render vignette
        shell: Rscript {0}
        run: |
          rmarkdown::render("vignettes/testBaconplots.Rmd")

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: bacon-plots-${{ matrix.os }}
          path: |
            vignettes/*.html
            vignettes/*.png
